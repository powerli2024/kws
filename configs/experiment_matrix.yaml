# Frozen experiment matrix v2. Thresholds are search ranges until calibrated.
# `runtime` is the only set of default scalars code may use. Grids remain search ranges.

schema_version: 2
selector: oracle_cer_prefer_original  # never MMS-FA
candidates: [original, spk1, spk2]
cascade_input: parent_stage_streams  # s3 from s1 wavs; s4 from s2 wavs
peak_norm: 0.7
truncate_max_sec: 6.0
truncate_mode: energy

cer:
  constraint_mean_max: 0.03
  constraint_cer0_drop_max: 0.02
  l1_slack: 0.0
  metric_zh: pinyin
  metric_en: char

arms:
  T0:
    select: cer_oracle
    se: none
    answers: "current best_sep enroll; baseline Presence FRR/FAR"
    stop_loss: "if rebuilt oracle mismatches best_sep, halt and inspect indexes"
  T1:
    select: cer_oracle
    se: conditional
    answers: "does need_se SE help CER-oracle enroll on Presence?"
    stop_loss: "need_se=False subset FRR/FAR must not worsen"
  T2:
    select: l2_text_residual_cos_gate
    se: none
    answers: "on dual-zero, does q_kw + catastrophe gate beat CER original-tie?"
    stop_loss: "if no q_kw sidecar, do not claim T2 failed; skip T3"
  T3:
    select: l2
    se: conditional
    answers: "T2 plus SE"
    stop_loss: "same as T1 on need_se=False"
  T4:
    select: cer_oracle
    se: always
    answers: "global SE should lose; if it wins, need_se is wrong"
    stop_loss: "do not ship T4 even if it ties T1"

skip_sep:
  after_scores: orig_unique_zero_only
  before_bss: disabled_until_residual_calibrated
  forbidden: duration_le_1.8s

need_se:
  p_music_orig_grid: [0.30, 0.40, 0.50]
  p_music_sep_grid: [0.25, 0.35, 0.45]
  snr_orig_grid_db: [3, 5, 8]
  snr_sep_grid_db: [5, 8, 12]
  target_trigger_rate: [0.15, 0.30]
  se_cos_grid: [0.90, 0.91, 0.92, 0.93, 0.94, 0.95]
  cer_slack: 0.05  # SE regression slack; not the L1 selector slack

catastrophe_cos:
  role: disaster_detector_not_purity
  grid: [0.90, 0.91, 0.92, 0.93, 0.94, 0.95]
  default_until_calibrated: 0.92

window_min_cos:
  min_dur_sec: 0.8
  win_sec: 0.8
  hop_sec: 0.4
  min_speech_for_veto_sec: 1.2
  percentile_grid: [5, 10, 15, 20]
  lock_with: 100_listen_labels
  note: "0.6s windows are not assumed reliable for ERes2NetV2; do not veto if VAD speech < 1.2s"

presence_veto:
  freeze_cmd: datasetA pos/neg
  freeze_tau:
    zh: 0.29305
    en: 0.357868
  encoder: eres2netv2
  go: frr_or_far_down_other_not_up
  do_not_force_calib_on: ve_mix_novad

eval_subsets:
  all_kws: 1838
  original_winners: from best_sep oracle_stream==original
  dual_zero: original and sep both CER 0
  orig_unique_zero: skip-sep candidate
  listen100: residual labels when available
  hard_neg: only if uid guarantees different speakers — otherwise unused

# Single source of runtime defaults. review_checklist and kws.config validate
# these against catastrophe_cos.default_until_calibrated / cer.l1_slack / windows.
runtime:
  l1_slack: 0.0
  se_cer_slack: 0.05
  lambda: 0.0
  catastrophe_cos: 0.92
  se_cos_thr: 0.92
  p_music_orig: 0.40
  p_music_sep: 0.35
  snr_orig_db: 5.0
  snr_sep_db: 8.0
  window_min_dur_sec: 0.8
  window_win_sec: 0.8
  window_hop_sec: 0.4
  window_min_speech_for_veto_sec: 1.2
  reject_q_high: 0.80
  reject_pair_cos: 0.35
  # pre-BSS skip is intentionally stricter than need_se, and stays OFF
  skip_bss_p_music_max: 0.15
  skip_bss_snr_min_db: 15.0
  skip_bss_enabled: false

cmd_cosine_eval:
  role: kws_local_rank_not_contest_veto
  primary: [frr_far_at_locked_tau_by_lang, pos_p10, neg_p90, paired_delta]
  secondary: [eer, auc, mean_gap]
  groups: [e0_raw, e1_t0, e2_qkw, oracle_cmd]
  split_lang: true
  intervals: [wilson, bootstrap]
  tau_probe_not_adopt: {zh: 0.29305, en: 0.357868}

bakeoff:
  E0: raw_kws
  E1: cer_oracle
  E2: qkw_plus_catastrophe
  E3: extra_separator_in_extract_sep_not_kws
  E4: conditional_se_after_e2
  E5: reserved
  E6: always_se_negative_control
  Oracle: max_cos_enroll_cmd_offline_only

do_not:
  - train a new separator in this repo
  - use MMS-FA to pick enroll
  - use cos(candidate, raw) as a purity / L2 rank score
  - put heuristic p_music into official L2
  - use cos(e, e_cmd_crop) at test time
  - use SI-SDR on real KWS as a main metric
  - treat DNSMOS BAK up as speaker success
  - treat datasetA id as speaker_id
  - claim T2/T3 results without a real q_kw sidecar
